<script>
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
const SAVE_KEY   = 'sad_data.bin';
const MAIN_KEY   = 'data.bin';
const MAFIA_KEY  = 'mafia_skin_owned';
const ACH_HIDE_KEY = 'sad_ach_hidden';
const RESET_FLAG = 'sad_reset_pending';   // маркер "идёт сброс"
/* =========================================================
   💰 ЭКОНОМИКА САДА — единый центр
   Все цены, таймеры, штрафы и коэффициенты сада собраны здесь.
   Ниже — только читаемые алиасы, чтобы код не пришлось переписывать.
   ========================================================= */
const GARDEN_ECON = {
  resetMoneyBelow: 7,          // защита от сброса при «нулевом» балансе
  gardenBase: 10,              // стартовый размер сада
  gardenMax: 50,               // максимальный размер
  sizeStep: 5,                 // шаг расширения
  sizeUpgradePrice: 5e9,       // расширение сада
  newGardenPrice: 100e12,      // покупка второго сада
  maximPrice: 100e12,          // Максим-садовник
  policeBaseInterval: 3600000, // обычный интервал облав
  policeCrackdownInterval: 1800000, // интервал во время «досмотра»
  dillFinePerUnit: 5e11,       // штраф за 1 укроп при облаве (~50% цены)
  waterCooldownMs: 6000,       // перезарядка полива
  pansyBaseSurvival: 0.01,     // шанс выжить без полива
  pansyWaterBonus: 0.01        // +шанс за каждый полив
};

const SAVE_VERSION = 24;
const RESET_MONEY_BELOW = GARDEN_ECON.resetMoneyBelow;
const GARDEN_BASE = GARDEN_ECON.gardenBase;
const GARDEN_MAX  = GARDEN_ECON.gardenMax;
const SIZE_STEP   = GARDEN_ECON.sizeStep;
const SIZE_UPGRADE_PRICE = GARDEN_ECON.sizeUpgradePrice;
const NEW_GARDEN_PRICE   = GARDEN_ECON.newGardenPrice;
const MAXIM_PRICE        = GARDEN_ECON.maximPrice;
const POLICE_BASE_INTERVAL      = GARDEN_ECON.policeBaseInterval;
const POLICE_CRACKDOWN_INTERVAL = GARDEN_ECON.policeCrackdownInterval;
const DILL_FINE_PER_UNIT = GARDEN_ECON.dillFinePerUnit;
const WATER_COOLDOWN_MS  = GARDEN_ECON.waterCooldownMs;

const POSITION_SAMPLES   = 5;
const POSITION_TOLERANCE = 0;
const POSITION_WARNS     = 50;
const MAX_WARNS          = 100;

const CLICKER_MAGIC = 0x56434442;
const CLICKER_BASKETS = ['click','auto','casino','crypto','mining'];
const CLICKER_OFFSETS = { click: 12, auto: 20, casino: 28, crypto: 36, mining: 44 };
const CLICKER_BASKET_ORDER = ['auto','casino','click','crypto','mining'];

const SIZE_LIST = [];
for (let s = GARDEN_BASE; s <= GARDEN_MAX; s += SIZE_STEP) SIZE_LIST.push(s);
const SIZE_UPGRADES = SIZE_LIST.slice(0, -1).map((s, i) => ({ from: s, to: SIZE_LIST[i + 1], price: SIZE_UPGRADE_PRICE }));
function nextSizeUpgrade(size) { return SIZE_UPGRADES.find(u => u.from === size) || null; }
function isSizeValid(s) { return SIZE_LIST.includes(s); }

const PLANT_KEYS = ['rose', 'mandarin', 'pansy', 'lemon', 'dill'];
const PLANTS = {
  rose: { name: 'Роза', emoji: '🌹', hue: 340, packPrice: 150e6, packSeeds: 150, growTime: 3600000, sellPrice: 1.5e6, shelfLife: 3 * 3600000, priceMult: 'rose' },
  mandarin: { name: 'Мандарин', emoji: '🍊', hue: 30, packPrice: 1e9, packSeeds: 100, growTime: 2 * 3600000, sellPrice: 100e6, shelfLife: 5 * 3600000, priceMult: 'mandarin' },
  pansy: { name: 'Анютины глазки', emoji: '🌼', hue: 280, packPrice: 500e9, packSeeds: 10, growTime: 600000, sellPrice: 1e12, shelfLife: 3 * 3600000, needsWater: true },
  lemon: { name: 'Лимон', emoji: '🍋', hue: 55, packPrice: 1e12, packSeeds: 1, growTime: 24 * 3600000, sellPrice: 100e12, shelfLife: Infinity },
  dill: { name: 'Укроп', emoji: '🌿', hue: 120, packPrice: 100e9, packSeeds: 100, growTime: 3600000, sellPrice: 1e12, shelfLife: Infinity, isDrug: true }
};

/* =========================================================
   UTILS
   ========================================================= */
function fmt(n) {
  n = Math.floor(n);
  if (!isFinite(n) || n <= 0) return '0';
  if (n < 1000) return String(n);
  const units = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i = -1;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + units[i];
}
function fmtTime(ts) { const d = new Date(ts); const p = n => String(n).padStart(2,'0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}ч ${m}м`;
  if (m > 0) return `${m}м ${sec}с`;
  return `${sec}с`;
}
function toast(msg) {
  const box = document.getElementById('toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 1800);
}

/* =========================================================
   МОСТ К КЛИКЕРУ (data.bin)
   ========================================================= */
let _clickerCache = { money: 0, at: 0 };
function readClickerMoney() {
  const now = Date.now();
  if (_clickerCache.at && now - _clickerCache.at < 500) return _clickerCache.money;
  let money = 0;
  try {
    const b64 = localStorage.getItem(MAIN_KEY);
    if (b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const v = new DataView(bytes.buffer);
      if (v.getUint32(0, true) === CLICKER_MAGIC) {
        for (const k of CLICKER_BASKETS) {
          const val = v.getFloat64(CLICKER_OFFSETS[k], true);
          if (isFinite(val) && val > 0) money += val;
        }
      }
    }
  } catch (e) { money = 0; }
  _clickerCache = { money, at: now };
  return money;
}
function invalidateClickerCache() { _clickerCache = { money: 0, at: 0 }; }

function spendClickerMoney(amount) {
  if (!(amount > 0)) return true;
  try {
    const b64 = localStorage.getItem(MAIN_KEY);
    if (!b64) return false;
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const v = new DataView(bytes.buffer);
    if (v.getUint32(0, true) !== CLICKER_MAGIC) return false;
    const baskets = {};
    let total = 0;
    for (const k of CLICKER_BASKETS) {
      let val = v.getFloat64(CLICKER_OFFSETS[k], true);
      if (!isFinite(val) || val < 0) val = 0;
      baskets[k] = val; total += val;
    }
    if (total < amount) return false;
    let rem = amount;
    const order = CLICKER_BASKETS.slice().sort(() => Math.random() - 0.5);
    for (const k of order) { if (rem <= 0) break; const take = Math.min(baskets[k], rem); baskets[k] -= take; rem -= take; }
    for (const k of CLICKER_BASKETS) { v.setFloat64(CLICKER_OFFSETS[k], baskets[k], true); }
    const s = CLICKER_BASKET_ORDER.map(k => k + ':' + Math.floor(baskets[k])).join('|');
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    v.setUint32(8, h >>> 0, true);
    let newBin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) newBin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    localStorage.setItem(MAIN_KEY, btoa(newBin));
    invalidateClickerCache();
    return true;
  } catch (e) { return false; }
}

/* =========================================================
   ДЕНЬГИ
   ========================================================= */
function getTotalMoney() { return state.money + readClickerMoney(); }
function canAfford(amount) { return getTotalMoney() >= amount; }
function spendTotal(amount) {
  if (frozen) return false;
  if (state.money >= amount) { state.money -= amount; return true; }
  const fromGarden = state.money;
  const rem = amount - fromGarden;
  if (!spendClickerMoney(rem)) return false;
  state.money = 0;
  return true;
}

/* =========================================================
   STATE
   ========================================================= */
function freshGarden() {
  return { size: GARDEN_BASE, cells: {}, maximBought: false, maximEnabled: true, lastRaid: Date.now() };
}
function freshStats() {
  return { planted: 0, harvested: 0, harvestedByType: { rose: 0, mandarin: 0, pansy: 0, lemon: 0, dill: 0 }, raids: 0, maxFine: 0, watered: 0, newsSeen: 0 };
}
function freshState() {
  return {
    version: SAVE_VERSION,
    money: 0,
    activeGarden: 0,
    gardens: [freshGarden()],
    seeds:     { rose: 0, mandarin: 0, pansy: 0, lemon: 0, dill: 0 },
    harvested: { rose: 0, mandarin: 0, pansy: 0, lemon: 0, dill: 0 },
    fertilizers: 0,
    crackdown: false,
    priceMult: { rose: 1, mandarin: 1 },
    scheduled: [],
    nextRandomNewsAt: 0,
    newsHistory: [],
    selectedPlant: 'rose',
    lastWaterAt: 0,
    lastTick: Date.now(),
    lastSave: Date.now(),
    achievements: {},
    stats: freshStats(),
    autoClickWarns: 0
  };
}
let state = freshState();
let frozen = false;

let achHidden = false;
try { achHidden = localStorage.getItem(ACH_HIDE_KEY) === '1'; } catch(e){}

function save() {
  if (frozen) return;
  /* Не сохраняем, если стоит флаг сброса из другой вкладки */
  try { if (localStorage.getItem(RESET_FLAG) === '1') return; } catch(e){}
  try { state.lastSave = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('Save error', e); }
}
function load() {
  try {
    /* Если стоит флаг сброса — обнуляем сразу, без чтения файла */
    let resetPending = false;
    try { resetPending = localStorage.getItem(RESET_FLAG) === '1'; } catch(e){}
    if (resetPending) {
      try { localStorage.removeItem(RESET_FLAG); } catch(e){}
      try { localStorage.removeItem(SAVE_KEY); } catch(e){}
      state = freshState();
      return;
    }
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return;
    const savedVersion = typeof obj.version === 'number' ? obj.version : 0;
    const fresh = freshState();
    state = Object.assign(fresh, obj);
    state.version = SAVE_VERSION;
    if (savedVersion < RESET_MONEY_BELOW) {
      state.money = 0;
      setTimeout(() => toast('♻️ Сад обновлён: баланс сада обнулён'), 500);
    } else {
      state.money = Number(state.money) || 0;
    }
    state.gardens = (state.gardens || []).map(g => {
      let size = g.size || GARDEN_BASE;
      if (!isSizeValid(size)) size = GARDEN_BASE;
      return { size, cells: g.cells || {}, maximBought: !!g.maximBought, maximEnabled: g.maximEnabled !== false, lastRaid: g.lastRaid || Date.now() };
    });
    if (!state.gardens.length) state.gardens.push(freshGarden());
    state.selectedPlant = PLANT_KEYS.includes(state.selectedPlant) ? state.selectedPlant : 'rose';
    if (!state.priceMult) state.priceMult = { rose: 1, mandarin: 1 };
    if (!state.achievements || typeof state.achievements !== 'object') state.achievements = {};
    if (!state.stats || typeof state.stats !== 'object') state.stats = freshStats();
    const sF = freshStats();
    for (const k in sF) if (state.stats[k] === undefined) state.stats[k] = sF[k];
    if (!state.stats.harvestedByType) state.stats.harvestedByType = sF.harvestedByType;
    for (const k of PLANT_KEYS) if (state.stats.harvestedByType[k] === undefined) state.stats.harvestedByType[k] = 0;
    const interval = getPoliceInterval();
    for (const g of state.gardens) {
      if (Date.now() - g.lastRaid > interval * 3) g.lastRaid = Date.now();
    }
  } catch (e) { console.error('Load error', e); }
}
function reloadGardenMoneyFromDisk() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const obj = JSON.parse(raw);

function currentGarden() { return state.gardens[state.activeGarden]; }
function cellKey(x, y) { return x + ',' + y; }
function getCell(g, x, y) { return g.cells[cellKey(x, y)]; }
function setCell(g, x, y, c) { g.cells[cellKey(x, y)] = c; }
function deleteCell(g, x, y) { delete g.cells[cellKey(x, y)]; }
function hasMafiaSkin() { try { return localStorage.getItem(MAFIA_KEY) === '1'; } catch(e){ return false; } }

function plantProgress(cell, def, now) {
  const elapsed = now - cell.plantedAt;
  if (cell.dead) return { stage: 'dead', elapsed, progress: 1 };
  if (elapsed < def.growTime) return { stage: 'growing', elapsed, progress: elapsed / def.growTime };
  if (def.shelfLife !== Infinity && elapsed > def.growTime + def.shelfLife) return { stage: 'rotten', elapsed, progress: 1 };
  return { stage: 'mature', elapsed, progress: 1 };
}
function getSellPrice(k) {
  const def = PLANTS[k]; if (!def) return 0;
  let mult = 1;
  if (def.priceMult && state.priceMult[def.priceMult] !== undefined) mult = state.priceMult[def.priceMult];
  return def.sellPrice * mult;
}
function getPackPrice(k) {
  const def = PLANTS[k]; if (!def) return 0;
  let mult = 1;
  if (def.priceMult && state.priceMult[def.priceMult] !== undefined) mult = state.priceMult[def.priceMult];
  return def.packPrice * mult;
}
function getPoliceInterval() {
  let base = state.crackdown ? POLICE_CRACKDOWN_INTERVAL : POLICE_BASE_INTERVAL;
  if (hasMafiaSkin()) base *= 2;
  return base;
}

const clickPositions = [];
function registerClick(x, y) {
  clickPositions.push({ x, y });
  if (clickPositions.length > POSITION_SAMPLES) clickPositions.shift();
  if (clickPositions.length === POSITION_SAMPLES) {
    const first = clickPositions[0];
    let allSame = true;
    for (let i = 1; i < POSITION_SAMPLES; i++) {
      const p = clickPositions[i];
      if (Math.abs(p.x - first.x) > POSITION_TOLERANCE || Math.abs(p.y - first.y) > POSITION_TOLERANCE) { allSame = false; break; }
    }
    if (allSame) {
      clickPositions.length = 0;
      state.autoClickWarns = (state.autoClickWarns || 0) + POSITION_WARNS;
      if (state.autoClickWarns >= MAX_WARNS) { autoblockerScreen(); return false; }
    }
  }
  return true;
}

function buyPack(k) {
  const def = PLANTS[k]; if (!def) return;
  const price = getPackPrice(k);
  if (!canAfford(price)) { toast('❌ Не хватает монет'); return; }
  if (!spendTotal(price)) { toast('❌ Не удалось списать монеты'); return; }
  state.seeds[k] += def.packSeeds;
  toast(`📦 Куплено ${def.packSeeds} семян ${def.name} за 🪙 ${fmt(price)}`);
  renderAll(); save();
}
function plantAt(g, x, y) {
  const k = state.selectedPlant; const def = PLANTS[k];
  if (!def || state.seeds[k] <= 0) return false;
  if (x < 0 || y < 0 || x >= g.size || y >= g.size) return false;
  if (getCell(g, x, y)) return false;
  state.seeds[k]--;
  const cell = { plant: k, plantedAt: Date.now() };
  if (def.needsWater) { cell.watered = 0; cell.resolved = false; cell.dead = false; }
  setCell(g, x, y, cell);
  state.stats.planted++;
  return true;
}
function harvestAt(g, x, y) {
  const cell = getCell(g, x, y); if (!cell) return false;
  const def = PLANTS[cell.plant]; if (!def) { deleteCell(g, x, y); return false; }
  const now = Date.now();
  const prog = plantProgress(cell, def, now);
  if (prog.stage === 'mature' && !cell.dead) {
    state.harvested[cell.plant] = (state.harvested[cell.plant] || 0) + 1;
    state.stats.harvested++;
    state.stats.harvestedByType[cell.plant] = (state.stats.harvestedByType[cell.plant] || 0) + 1;
    deleteCell(g, x, y);
    return true;
  }
  if (prog.stage === 'dead' || prog.stage === 'rotten') { deleteCell(g, x, y); return false; }
  return false;
}
function plantAll() {
  const g = currentGarden();
  const k = state.selectedPlant;
  const available = state.seeds[k];
  if (available <= 0) { toast(`❌ Нет семян ${PLANTS[k].name}`); return; }
  let planted = 0;
  const size = g.size;
  outer: for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (planted >= available) break outer;
      if (!getCell(g, x, y)) { if (plantAt(g, x, y)) planted++; }
    }
  }
  if (planted > 0) { toast(`🌱 Посажено ${planted} × ${PLANTS[k].name}`); checkAchievements(); renderAll(); save(); }
  else toast('❌ Нет свободных мест');
}
function harvestAll() {
  const g = currentGarden();
  let n = 0;
  for (const key of Object.keys(g.cells)) {
    const [x, y] = key.split(',').map(Number);
    if (harvestAt(g, x, y)) n++;
  }
  if (n > 0) { toast(`🧺 Собрано ${n}`); checkAchievements(); renderAll(); save(); }
  else toast('Нечего собирать');
}
function sellAllHarvested() {
  let total = 0;
  for (const k of PLANT_KEYS) {
    const c = state.harvested[k] || 0;
    if (c <= 0) continue;
    total += getSellPrice(k) * c;
    state.harvested[k] = 0;
  }
  if (total > 0) { state.money += total; toast(`💰 Продано за 🪙 ${fmt(total)}`); checkAchievements(); renderAll(); save(); }
  else toast('Нечего продавать');
}
function waterAllPansies() {
  const now = Date.now();
  if (now - state.lastWaterAt < WATER_COOLDOWN_MS) {
    toast(`⏳ Подожди ${((WATER_COOLDOWN_MS - (now - state.lastWaterAt))/1000).toFixed(1)}с`);
    return;
  }
  let n = 0;
  for (const g of state.gardens) {
    for (const key in g.cells) {
      const c = g.cells[key];
      if (c.plant === 'pansy' && !c.resolved && !c.dead) { c.watered = (c.watered || 0) + 1; n++; }
    }
  }
  if (!n) { toast('Нет растущих Анютиных глазок'); return; }
  state.lastWaterAt = now;
  state.stats.watered++;
  toast(`💧 Полито ${n}`);
  checkAchievements(); renderAll(); save();
}
function toggleHideDill() {
  const now = Date.now();
  let count = 0, anyHidden = false;
  for (const g of state.gardens) {
    for (const key in g.cells) {
      const c = g.cells[key];
      if (c.plant !== 'dill') continue;
      if (!c.hidden) { c.hidden = true; c.hiddenAt = now; anyHidden = true; count++; }
      else { const dur = now - (c.hiddenAt || now); c.plantedAt += dur; delete c.hidden; delete c.hiddenAt; count++; }
    }
  }
  if (!count) { toast('Нет укропа'); return; }
  toast(anyHidden ? `🫥 Скрыто ${count} (рост остановлен)` : `👁️ Показано ${count} (растёт)`);
  renderAll(); save();
}

   POLICE / NEWS
   ========================================================= */
function policeRaid() {
  let totalDill = 0;
  for (const g of state.gardens) for (const key in g.cells) {
    const c = g.cells[key];
    if (c.plant === 'dill' && !c.hidden) totalDill++;
  }
  state.stats.raids++;
  if (totalDill === 0) { addNews('👮 Полиция прошлась по садам, ничего не нашла', 0); checkAchievements(); return; }
  const fine = totalDill * DILL_FINE_PER_UNIT;
  const total = getTotalMoney();
  const paid = Math.min(total, fine);
  if (paid > 0) spendTotal(paid);
  if (paid > state.stats.maxFine) state.stats.maxFine = paid;
  for (const g of state.gardens) for (const key in g.cells) {
    const c = g.cells[key];
    if (c.plant === 'dill' && !c.hidden) delete g.cells[key];
  }
  addNews(`🚨 Полиция изъяла ${totalDill} укропов! Штраф 🪙 ${fmt(paid)}`, -1);
  toast(`🚨 ОБЛАВА! Изъято ${totalDill}, штраф 🪙 ${fmt(paid)}`);
  checkAchievements(); renderAll(); save();
}
function addNews(text, dir) {
  state.newsHistory.unshift({ text, time: Date.now(), dir: dir || 0 });
  if (state.newsHistory.length > 20) state.newsHistory.pop();
  state.stats.newsSeen++;
}
function scheduleNews(id, delayMs) { state.scheduled.push({ id, at: Date.now() + delayMs }); }
const NEWS_DEFS = {
  roseTrend:  { text: 'Розы опять в тренде', apply: () => { state.priceMult.rose *= 2; }, dir: 1 },
  roseUntrend:{ text: 'Розы больше не в тренде', apply: () => { state.priceMult.rose *= 0.5; }, dir: -1 },
  march8:     { text: 'Наступило 8 марта', dir: 1, apply: () => { state.priceMult.rose *= 10; scheduleNews('march8End', 180000); } },
  march8End:  { text: '8 марта прошло', dir: -1, apply: () => { state.priceMult.rose /= 10; } },
  nyComing:   { text: 'Новый год через 3 дня', dir: 1, apply: () => { state.priceMult.mandarin *= 15; scheduleNews('nyApproaching', 3 * 3600000); } },
  nyApproaching: { text: 'Новый год наступает', dir: 1, apply: () => { if (Math.random() < 0.5) state.priceMult.mandarin *= 2; else state.priceMult.mandarin /= 15; scheduleNews('nyEnded', 3600000); } },
  nyEnded:    { text: 'Новый год закончился', dir: 0, apply: () => { state.priceMult.mandarin = 1; } },
  dillCrackdown: { text: 'Полиция начала активный досмотр всех садов, в связи с увеличившимся оборотом укропа', dir: -1, apply: () => { state.crackdown = true; } }
};
function applyNews(id) {
  const def = NEWS_DEFS[id]; if (!def) return;
  def.apply();
  addNews(def.text, def.dir || 0);
  toast('📰 ' + def.text);
  checkAchievements();
}
function tickNews() {
  const now = Date.now();
  for (let i = state.scheduled.length - 1; i >= 0; i--) {
    const ev = state.scheduled[i];
    if (now >= ev.at) { applyNews(ev.id); state.scheduled.splice(i, 1); }
  }
  if (now >= state.nextRandomNewsAt) {
    const pool = ['roseTrend', 'roseUntrend', 'march8', 'nyComing', 'dillCrackdown'];
    const id = pool[Math.floor(Math.random() * pool.length)];
    applyNews(id);
    state.nextRandomNewsAt = now + 300000 + Math.random() * 600000;
  }
}

/* =========================================================
   MAXIM & PANSY RESOLVE
   ========================================================= */
function maximWork() {
  for (const g of state.gardens) {
    if (!g.maximBought || !g.maximEnabled) continue;
    for (const key in g.cells) {
      const c = g.cells[key];
      if (c.plant === 'pansy' && !c.resolved && !c.dead && !c.hidden) { c.watered = (c.watered || 0) + 1; }
    }
    let harvested = 0;
    for (const key in g.cells) {
      if (harvested >= 50) break;
      const [x, y] = key.split(',').map(Number);
      if (harvestAt(g, x, y)) harvested++;
    }
    let planted = 0;
    const k = state.selectedPlant;
    if (!PLANTS[k] || state.seeds[k] <= 0) continue;
    const size = g.size;
    outer: for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        if (planted >= 50) break outer;
        if (state.seeds[k] <= 0) break outer;
        if (!getCell(g, x, y)) { if (plantAt(g, x, y)) planted++; }
      }
    }
  }
}
function resolvePansies() {
  const now = Date.now();
  for (const g of state.gardens) {
    for (const key in g.cells) {
      const c = g.cells[key];
      if (c.plant !== 'pansy' || c.resolved || c.dead || c.hidden) continue;
      const elapsed = now - c.plantedAt;
      if (elapsed >= PLANTS.pansy.growTime) {
        c.resolved = true;
        const chance = Math.min(1, GARDEN_ECON.pansyBaseSurvival + (c.watered || 0) * GARDEN_ECON.pansyWaterBonus);
        c.dead = Math.random() >= chance;
        if (c.dead) addNews(`🌼 Анютины глазки погибли (шанс ${(chance*100).toFixed(0)}%)`, -1);
      }
    }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
const canvas = document.getElementById('gardenCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
}
window.addEventListener('resize', () => { resizeCanvas(); render(); });

function plantColor(def, progress) {
  const t = Math.max(0, Math.min(1, progress));
  const l = 18 + t * 44;
  const s = 55 + t * 30;
  return `hsl(${def.hue}, ${s}%, ${l}%)`;
}
function plantDeadColor(def) { return `hsl(${def.hue}, 25%, 22%)`; }

function render() {
  if (!canvas.width) return;
  const w = canvas.width, h = canvas.height;
  const g = currentGarden(); if (!g) return;
  const size = g.size;
  const cell = w / size;
  const now = Date.now();
  const GREEN  = '#3d6b32';
  const BROWN  = '#5a3f24';
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      ctx.fillStyle = ((x + y) % 2 === 0) ? GREEN : BROWN;
      ctx.fillRect(x * cell, y * cell, cell + 0.6, cell + 0.6);
    }
  }
  if (cell > 4) {
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= size; i++) {
      const p = i * cell;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
    }
  }
  for (const key in g.cells) {
    const c = g.cells[key];
    const [x, y] = key.split(',').map(Number);
    const def = PLANTS[c.plant]; if (!def) continue;
    const prog = plantProgress(c, def, now);
    let color;
    if (c.hidden) color = 'rgba(80,80,80,0.55)';
    else if (prog.stage === 'dead' || prog.stage === 'rotten') color = plantDeadColor(def);
    else if (prog.stage === 'growing') color = plantColor(def, prog.progress);
    else color = plantColor(def, 1);
    ctx.fillStyle = color;
    const pad = Math.max(1, cell * 0.06);
    ctx.fillRect(x * cell + pad, y * cell + pad, cell - pad * 2 + 0.6, cell - pad * 2 + 0.6);
  }
}
canvas.addEventListener('click', (e) => {
  if (frozen) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const x = cx / rect.width * canvas.width;
  const y = cy / rect.height * canvas.height;
  if (!registerClick(cx, cy)) return;
  const g = currentGarden();
  const cell = canvas.width / g.size;
  const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
  const existing = getCell(g, gx, gy);
  if (existing) {
    const def = PLANTS[existing.plant];
    const prog = plantProgress(existing, def, Date.now());
    if (prog.stage === 'mature' && !existing.dead) {
      if (harvestAt(g, gx, gy)) { toast(`🧺 Собрано ${def.name}`); checkAchievements(); renderAll(); save(); }
    } else if (prog.stage === 'growing') { toast(`⏳ ${def.name} растёт (${fmtDur(def.growTime - prog.elapsed)})`); }
    else if (prog.stage === 'dead' || prog.stage === 'rotten') { deleteCell(g, gx, gy); renderAll(); save(); }
  } else {
    if (plantAt(g, gx, gy)) { renderAll(); save(); }
    else toast(`❌ Нет семян ${PLANTS[state.selectedPlant].name}`);
  }
});

    : `<div class="card"><div class="row"><b>📏 Сад макс. размера</b></div><div style="color:#8792a6;font-size:11px">${GARDEN_MAX}×${GARDEN_MAX}</div></div>`;
  html += `<div class="card"><div class="row"><b>🧑‍🌾 Максим-садовник</b><span>${g.maximBought ? 'куплен' : fmt(MAXIM_PRICE)+' 🪙'}</span></div><div style="color:#8792a6;font-size:11px">Авто-сажает, собирает и <b style="color:#3ddc84">поливает Анютины глазки</b></div><div class="row">${
    g.maximBought
      ? `<button class="btn" data-action="toggleMaxim">${g.maximEnabled?'Выключить':'Включить'}</button>`
      : `<button class="btn primary" data-action="buyMaxim" ${canAfford(MAXIM_PRICE)?'':'disabled'}>Нанять</button>`}</div></div>`;
  document.getElementById('upgrades').innerHTML = html;

function renderPolice() {
  const now = Date.now();
  const interval = getPoliceInterval();
  const nextRaid = Math.max(...state.gardens.map(g => g.lastRaid || 0)) + interval;
  const left = Math.max(0, nextRaid - now);
  let dillCount = 0;
  for (const g of state.gardens) for (const k in g.cells) if (g.cells[k].plant === 'dill') dillCount++;
  const box = document.getElementById('policeStatus');
  box.className = 'police-status' + (dillCount > 0 ? ' danger' : '');
  box.innerHTML = `Следующий рейд: <b>через ${fmtDur(left)}</b><br>
    Укропов в садах: <b>${dillCount}</b>${dillCount>0?' ⚠️':''}<br>
    Интервал: ${fmtDur(interval)}${state.crackdown?' (облавa!)':''}${hasMafiaSkin()?' · 🕴️ скин':''}`;
}

  const mainExists = !!localStorage.getItem(MAIN_KEY);
  $b.innerHTML = `

      <div style="color:#8792a6;font-size:11px">Удалит: грядки, семена, саженцы, достижения сада, деньги сада, Максима</div>

    </div>

      <div class="row"><button class="btn danger" data-action="resetAll">Сбросить игру и сад</button></div>
    </div>`;

/* =========================================================
   EVENTS
   ========================================================= */
document.body.addEventListener('click', (e) => {
  const g = e.target.closest('[data-garden]');
  if (g) { state.activeGarden = Number(g.dataset.garden); renderAll(); return; }
  const p = e.target.closest('[data-plant]');
  if (p) { state.selectedPlant = p.dataset.plant; renderAll(); return; }
  const b = e.target.closest('[data-buy]');
  if (b) { buyPack(b.dataset.buy); return; }
  const s = e.target.closest('[data-sell]');
  if (s) {
    const k = s.dataset.sell;
    const have = state.harvested[k] || 0; if (have <= 0) return;
    const price = getSellPrice(k), total = price * have;
    state.harvested[k] = 0; state.money += total;
    toast(`💰 Продано ${have} ${PLANTS[k].name} за 🪙 ${fmt(total)}`);
    checkAchievements(); renderAll(); save(); return;
  }
  const a = e.target.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'plantAll') plantAll();
    else if (act === 'harvestAll') harvestAll();
    else if (act === 'sellAll') sellAllHarvested();
    else if (act === 'water') waterAllPansies();
    else if (act === 'hideDill') toggleHideDill();
    else if (act === 'sizeUp') buySizeUpgrade();
    else if (act === 'newGarden') buyNewGarden();
    else if (act === 'buyMaxim') buyMaxim();
    else if (act === 'toggleMaxim') toggleMaxim();
    else if (act === 'resetGarden') resetGardenOnly();
    else if (act === 'resetAll') resetEverything();
    return;
  }
});

/* =========================================================
   TICK
   ========================================================= */
function tick() {
  if (frozen) return;

  /* Проверка: если sad_data.bin удалён извне — обнуляем state */
  try {
    const resetFlag = localStorage.getItem(RESET_FLAG) === '1';
    const noSave = localStorage.getItem(SAVE_KEY) === null;
    const hasCells = state.gardens.some(g => Object.keys(g.cells || {}).length > 0);
    if ((resetFlag || noSave) && (hasCells || Object.keys(state.achievements).length > 0)) {
      state = freshState();
      renderAll();
    }
  } catch(e) {}

  const now = Date.now();
  state.lastTick = now;
  resolvePansies();
  const interval = getPoliceInterval();
  let raid = false;
  for (const g of state.gardens) {
    if (now - (g.lastRaid || 0) >= interval) { g.lastRaid = now; raid = true; }
  }
  if (raid) policeRaid();
  tickNews();
  maximWork();
  checkAchievements();
  renderBalance(); renderPolice(); render();
  if (now - state.lastSave > 5000) save();
}
setInterval(tick, 1000);
setInterval(() => {
  renderToolbar(); renderUpgrades(); renderNews(); renderInv(); renderShop();
  if (!achHidden) renderAchs();
}, 2000);

  }
});
